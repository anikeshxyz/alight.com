services:
  postgres:
    image: postgres:16-alpine
    container_name: alight_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-alight_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-alight_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alight_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alight_backend_prod
    restart: always
    environment:
      BACKEND_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-alight_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://alight.com}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - alight_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alight_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alight_network

networks:
  alight_network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
